<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tactical War - Tournoi en direct</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Tactical War</div>
    <div class="title">
      <h1 id="tournament-name">En attente d'un tournoi...</h1>
      <span id="tournament-status" class="pill"></span>
    </div>
    <div class="meta">
      <a class="guide-link" href="guide.html" target="_blank">Guide du joueur</a>
      <a class="guide-link" href="telecharger.html" target="_blank">Télécharger le jeu</a>
      <span id="connection" class="dot" title="Connexion au serveur"></span>
      <span id="clock"></span>
    </div>
  </header>

  <main class="layout">
    <section class="panel board">
      <div class="panel-head">
        <h2 id="board-title">Tableau</h2>
        <div id="board-tabs" class="tabs"></div>
        <button id="board-rotate" class="rotate-toggle" title="Faire défiler les onglets automatiquement">Défilement</button>
      </div>
      <div id="board" class="board-content"></div>
    </section>

    <aside class="side">
      <section class="panel side-panel">
        <div class="panel-head">
          <div id="side-tabs" class="tabs side-tabs"></div>
          <button id="side-rotate" class="rotate-toggle" title="Faire défiler les onglets automatiquement">Défilement</button>
        </div>
        <div class="side-content">
          <div id="side-live" class="side-tab"><div id="live" class="live"></div></div>
          <div id="side-comments" class="side-tab" hidden><ul id="comments" class="comments"></ul></div>
          <div id="side-recent" class="side-tab" hidden><div id="recent" class="recent"></div></div>
          <div id="side-upcoming" class="side-tab" hidden><ol id="upcoming" class="upcoming"></ol></div>
          <div id="side-ranking" class="side-tab" hidden><div id="ranking"></div></div>
        </div>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
